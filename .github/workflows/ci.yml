name: ci
on:
  pull_request:
    branches: [main]
  merge_group:
jobs:
  checks:
    runs-on: [self-hosted, linux, x64, orca-vm]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Lint content
        run: pnpm lint:content
      - name: Lint assets
        run: pnpm lint:assets
