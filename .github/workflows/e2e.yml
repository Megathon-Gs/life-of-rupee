name: E2E and performance gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: [self-hosted, linux, x64, orca-vm]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Self-hosted runner is shared with agent dev servers. Free the Playwright
      # preview and gallery ports before their web servers start.
      - name: Free Playwright ports (self-hosted runner hygiene)
        run: |
          for p in 4173 4174 5197; do
            if command -v fuser >/dev/null 2>&1; then
              fuser -k -n tcp "$p" 2>/dev/null || true
            else
              pids=$(ss -ltnp 2>/dev/null | awk -v P=":$p" '$4 ~ P {print $NF}' | grep -oE 'pid=[0-9]+' | cut -d= -f2 || true)
              [ -n "$pids" ] && kill $pids 2>/dev/null || true
            fi
          done
          sleep 1
          ss -ltn 2>/dev/null | grep -E ':(4173|4174|5197)\b' && { echo "port still busy"; exit 1; } || echo "Playwright ports free"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Set Chrome path for Lighthouse CI
        run: echo "CHROME_PATH=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux64/chrome' -type f -print -quit)" >> "$GITHUB_ENV"
      - run: pnpm e2e
        env:
          CI: true
      - run: pnpm exec playwright test -c tests/visual/playwright.config.ts
        env:
          CI: true
      - run: pnpm build
      - run: pnpm exec lhci autorun --config=lighthouserc.json
